[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "margledger"
version = "0.2.0"
description = "Build per-iteration test-pass and token-cost ledgers from coding transcripts, then flag runs of flat test progress."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "SuperMarioYL" }]
requires-python = ">=3.12"
keywords = ["agent-loop", "marginal-value", "loop-engineering", "token-cost", "stop-recommendation", "test-suite", "observability"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Libraries",
    "Operating System :: OS Independent",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    # plotext 6 removed the whole 5.x terminal API (clf/subplots/build/...);
    # render_curve targets the 5.x line. Stay <6 until the port happens.
    "plotext>=5.3,<6",
    "junitparser>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
]

[project.scripts]
margledger = "margledger.cli:app"

[project.urls]
Homepage = "https://github.com/SuperMarioYL/margledger"
Repository = "https://github.com/SuperMarioYL/margledger"
Issues = "https://github.com/SuperMarioYL/margledger/issues"
Changelog = "https://github.com/SuperMarioYL/margledger/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["margledger*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
