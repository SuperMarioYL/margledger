<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="465" viewBox="0 0 1000 465" data-palette="e69956-e7e76a-f6b4ac-1ba6b4a0938c" role="img" aria-labelledby="process-dark-title process-dark-desc"><title id="process-dark-title">margledger process</title><desc id="process-dark-desc">The retrospective rule identifies the flat run beginning at iteration 3; no running agent is interrupted.</desc><defs><linearGradient id="brand" gradientUnits="userSpaceOnUse" x2="1000" y2="465"><stop stop-color="#e69956"/><stop offset=".6" stop-color="#e7e76a"/><stop offset="1" stop-color="#f6b4ac"/></linearGradient><radialGradient id="halo"><stop stop-color="#e69956" stop-opacity=".22"/><stop offset="1" stop-color="#0a090d" stop-opacity="0"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="5"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#3a291d" stroke-opacity=".35" stroke-width=".6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#e69956" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,"Noto Sans",sans-serif}.flow{stroke-dasharray:10 110;animation:flow 6s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}.turn{transform-box:fill-box;transform-origin:center;animation:turn 36s linear infinite}@keyframes flow{to{stroke-dashoffset:-360}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes turn{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transform:none!important}.flow{display:none}}</style><rect width="1000" height="465" rx="16" fill="#0a090d"/><rect width="1000" height="465" rx="16" fill="url(#grid)"/><ellipse cx="630.0" cy="199.95" rx="500.0" ry="325.5" fill="url(#halo)"/><text x="44" y="44" fill="#b2aaa8" font-size="13" text-anchor="start" font-weight="400">PROCESS / FROM INPUT TO RESULT</text><text x="44" y="84.0" fill="#fdf0ee" font-size="30" text-anchor="start" font-weight="400">From input to a useful result</text><path d="M332.0 237H356.0" fill="none" stroke="#e69956" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M332.0 237H356.0" class="flow" fill="none" stroke="#f6b4ac" stroke-width="2"/><rect x="44.0" y="176" width="288.0" height="122" rx="12" fill="#131317" stroke="#3a291d"/><text x="62.0" y="207.0" fill="#fdf0ee" font-size="21" text-anchor="start" font-weight="400">01  Record iterations</text><text x="62.0" y="259.0" fill="#b2aaa8" font-size="17" text-anchor="start" font-weight="400">Explicit tests and costs</text><path d="M644.0 237H668.0" fill="none" stroke="#e69956" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M644.0 237H668.0" class="flow" fill="none" stroke="#f6b4ac" stroke-width="2"/><rect x="356.0" y="176" width="288.0" height="122" rx="12" fill="#131317" stroke="#3a291d"/><text x="374.0" y="207.0" fill="#fdf0ee" font-size="21" text-anchor="start" font-weight="400">02  Compute deltas</text><text x="374.0" y="259.0" fill="#b2aaa8" font-size="17" text-anchor="start" font-weight="400">1, 2, 0, 0</text><rect x="668.0" y="176" width="288.0" height="122" rx="12" fill="#131317" stroke="#3a291d"/><text x="686.0" y="207.0" fill="#fdf0ee" font-size="21" text-anchor="start" font-weight="400">03  Find flat run</text><text x="686.0" y="259.0" fill="#b2aaa8" font-size="17" text-anchor="start" font-weight="400">Two consecutive zero gains</text><text x="44" y="379.0" fill="#f6b4ac" font-size="20" text-anchor="start" font-weight="400">The retrospective rule identifies the flat run beginning at iteration 3; no</text><text x="44" y="407.0" fill="#f6b4ac" font-size="20" text-anchor="start" font-weight="400">running agent is interrupted.</text></svg>
